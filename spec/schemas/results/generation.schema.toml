# CE data format 1.0 — results table `generation` (dispatch).

[table]
name = "generation"
scope = "results"
required = false
since = "1.0"
grain = "unit-period"
family = "dispatch"
series = true
primary_key = ["year", "scenario", "weather", "block", "period", "source_type", "component_name"]
description = """
Per-period dispatch of every unit. Every MW value is NON-NEGATIVE; direction is carried by `source_type`:
storage charging is a `storage_charge` row whose `dispatch_mw` is the power withdrawn. Net injection at a
bus = Σ thermal + renewable + storage_discharge − storage_charge. Rows with zero dispatch may be omitted."""

[[column]]
name = "year"
type = "int16"
required = true
unit = "year"
description = "Investment year."

[[column]]
name = "scenario"
type = "int16"
required = true
min = 1
description = "Scenario index, 1-based."

[[column]]
name = "weather"
type = "int16"
required = true
description = "Weather axis value: the weather-year label, or its 1-based ordinal (manifest `[time] weather_axis`)."

[[column]]
name = "block"
type = "int16"
required = true
min = 1
description = "Time block id."

[[column]]
name = "period"
type = "int32"
required = true
min = 1
description = "Period within the block, 1-based, hour-ending."

[[column]]
name = "source_type"
type = "string"
required = true
enum = ["thermal", "renewable", "storage_discharge", "storage_charge"]
description = "Kind of row; `storage_charge` rows are withdrawals."

[[column]]
name = "component_id"
type = "int32"
description = "The component's integer id in the input bundle (informational)."

[[column]]
name = "component_name"
type = "string"
required = true
description = "Unit name: a `generators.name`, `storage.name` or `candidates.candidate_id`."

[[column]]
name = "technology"
type = "string"
required = true
description = "Technology code."

[[column]]
name = "bus"
type = "string"
required = true
description = "Bus name (`buses.name`)."

[[column]]
name = "dispatch_mw"
type = "float64"
required = true
unit = "MW"
min = 0.0
atol = 1e-6
description = "Average power over the period (output, or withdrawal on storage_charge rows)."

[[column]]
name = "floor_slack_mw"
type = "float64"
unit = "MW"
min = 0.0
atol = 1e-6
description = "Shortfall below a must-run floor the unit was allowed to take (0 when none)."

[[column]]
name = "varcost_per_mwh"
type = "float64"
unit = "currency/MWh"
description = "The variable cost the run priced this row's energy at. Null/NaN on storage_charge rows."

[[column]]
name = "bus_label"
type = "string"
description = "Display label of `bus`."

[[alias]]
legacy = "varcost_gbp_per_mwh"
canonical = "varcost_per_mwh"

[[alias]]
legacy = "bus_name"
canonical = "bus_label"
