# CE data format 1.0 — results table `lmp`.

[table]
name = "lmp"
scope = "results"
required = false
since = "1.0"
grain = "bus-period"
family = "price"
series = true
primary_key = ["year", "scenario", "weather", "block", "bus", "period"]
description = """
Locational marginal prices: the marginal cost of serving one more MWh of withdrawal at the bus in the period
(the dual of the bus energy balance, in currency/MWh, undiscounted). The optional decomposition is an
ATTRIBUTION whose three parts sum EXACTLY to the total: lmp_per_mwh = lmp_energy + lmp_congestion + lmp_loss.
The energy part is the reference bus's price; the loss part is −energy × the bus's marginal loss factor;
the congestion part is the remainder (so cost terms that the loss model does not attribute, such as
controllable-corridor losses, land in congestion). Give all three parts or none."""

[[column]]
name = "year"
type = "int16"
required = true
unit = "year"
description = "Investment year."

[[column]]
name = "scenario"
type = "int16"
required = true
min = 1
description = "Scenario index, 1-based."

[[column]]
name = "weather"
type = "int16"
required = true
description = "Weather axis value (label or ordinal, per the manifest)."

[[column]]
name = "block"
type = "int16"
required = true
min = 1
description = "Time block id."

[[column]]
name = "bus"
type = "string"
required = true
description = "Bus name (`buses.name`)."

[[column]]
name = "period"
type = "int32"
required = true
min = 1
description = "Period within the block, 1-based, hour-ending."

[[column]]
name = "lmp_per_mwh"
type = "float64"
required = true
unit = "currency/MWh"
description = "Total nodal price."

[[column]]
name = "lmp_energy"
type = "float64"
unit = "currency/MWh"
description = "Energy component (the reference bus price)."

[[column]]
name = "lmp_congestion"
type = "float64"
unit = "currency/MWh"
description = "Congestion component (residual of the attribution)."

[[column]]
name = "lmp_loss"
type = "float64"
unit = "currency/MWh"
description = "Marginal-loss component."

[[column]]
name = "floor_slack_at_bus"
type = "bool"
description = "True when a must-run unit at the bus was below its floor in the period (its price is then not a clean marginal cost)."

[[column]]
name = "bus_label"
type = "string"
description = "Display label of `bus`."

[[alias]]
legacy = "lmp_gbp_per_mwh"
canonical = "lmp_per_mwh"

[[alias]]
legacy = "bus_name"
canonical = "bus_label"
