# CE data format 1.0 — results table `curtailment`.

[table]
name = "curtailment"
scope = "results"
required = false
since = "1.0"
grain = "site-period"
family = "dispatch"
series = true
primary_key = ["year", "scenario", "weather", "block", "period", "site_name"]
description = """
Available-but-unused output of availability-bounded resources. curtailed_mw = available_mw − dispatch_mw
exactly, where available_mw = capacity in service × cf. A writer that does not produce this table leaves it
out; a reader may derive it from `availability`, `investment` and `generation`."""

[[column]]
name = "year"
type = "int16"
required = true
unit = "year"
description = "Investment year."

[[column]]
name = "scenario"
type = "int16"
required = true
min = 1
description = "Scenario index, 1-based."

[[column]]
name = "weather"
type = "int16"
required = true
description = "Weather axis value (label or ordinal, per the manifest)."

[[column]]
name = "block"
type = "int16"
required = true
min = 1
description = "Time block id."

[[column]]
name = "period"
type = "int32"
required = true
min = 1
description = "Period within the block, 1-based, hour-ending."

[[column]]
name = "site_name"
type = "string"
required = true
description = "A `generators.name` or `candidates.candidate_id`."

[[column]]
name = "technology"
type = "string"
required = true
description = "Technology code."

[[column]]
name = "bus"
type = "string"
required = true
description = "Bus name (`buses.name`)."

[[column]]
name = "available_mw"
type = "float64"
required = true
unit = "MW"
min = 0.0
atol = 1e-6
description = "Capacity in service × cf."

[[column]]
name = "dispatch_mw"
type = "float64"
required = true
unit = "MW"
min = 0.0
atol = 1e-6
description = "Output actually dispatched."

[[column]]
name = "curtailed_mw"
type = "float64"
required = true
unit = "MW"
min = 0.0
atol = 1e-6
description = "available_mw − dispatch_mw."
