# CE data format 1.0 — results table `transmission_losses`.

[table]
name = "transmission_losses"
scope = "results"
required = false
since = "1.0"
grain = "line-period"
family = "flow"
series = true
primary_key = ["year", "scenario", "weather", "block", "line", "period"]
description = "Physical loss per lossy line and period. Lines without losses may be omitted."

[[column]]
name = "year"
type = "int16"
required = true
unit = "year"
description = "Investment year."

[[column]]
name = "scenario"
type = "int16"
required = true
min = 1
description = "Scenario index, 1-based."

[[column]]
name = "weather"
type = "int16"
required = true
description = "Weather axis value (label or ordinal, per the manifest)."

[[column]]
name = "block"
type = "int16"
required = true
min = 1
description = "Time block id."

[[column]]
name = "line"
type = "string"
required = true
description = "Line name (`lines.name`)."

[[column]]
name = "period"
type = "int32"
required = true
min = 1
description = "Period within the block, 1-based, hour-ending."

[[column]]
name = "loss_mw"
type = "float64"
required = true
unit = "MW"
min = 0.0
atol = 1e-6
description = "Average power lost on the line over the period."
