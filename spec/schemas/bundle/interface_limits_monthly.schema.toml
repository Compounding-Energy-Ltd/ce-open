# CE data format 1.0 — bundle table `interface_limits_monthly`.

[table]
name = "interface_limits_monthly"
scope = "bundle"
required = false
since = "1.0"
grain = "interface-month"
primary_key = ["interface_id", "month"]
description = """
Seasonal interface limits. A row REPLACES the interface's base limits in that calendar month (months are
UTC calendar months of the period's start instant). Months without a row keep the base limits."""

[[column]]
name = "interface_id"
type = "int32"
required = true
description = "Interface (`interfaces.interface_id`)."

[[column]]
name = "month"
type = "int8"
required = true
min = 1
max = 12
description = "Calendar month, 1 = January."

[[column]]
name = "max_fwd_mw"
type = "float64"
unit = "MW"
min = 0.0
description = "Forward limit in this month. Null = unbounded."

[[column]]
name = "max_rev_mw"
type = "float64"
unit = "MW"
min = 0.0
description = "Reverse limit in this month. Null = unbounded."

[[foreign_key]]
column = "interface_id"
references = "interfaces.interface_id"
