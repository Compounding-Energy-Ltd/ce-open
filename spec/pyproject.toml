[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ce-spec"
version = "1.0.0"
description = "The CE data-format specification in code: Arrow/Parquet schemas, the .prov grammar and validators for CE bundles and results"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Compounding Energy Ltd" }]
requires-python = ">=3.11"
dependencies = ["pyarrow>=14"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ce-spec = "ce_spec.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_spec"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "ce_spec/schemas"

[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "tests", "examples", "SPEC.md", "TABLES.md", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
