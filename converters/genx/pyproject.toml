[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ce-genx"
version = "0.1.0"
description = "Import GenX case folders as CE data-format bundles"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Compounding Energy Ltd" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
validate = ["ce-spec>=1.0"]   # the CE format validator (spec/ in this repository)
test = ["pytest>=7"]

[project.scripts]
ce-genx-import = "ce_genx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
